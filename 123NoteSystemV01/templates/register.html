{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="auth-mark" aria-hidden="true">123</div>
  <h1 class="auth-title">建立你的筆記空間</h1>
  <p class="auth-copy">只需幾個欄位，就能開始把想法收進來。</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="username">顯示名稱</label>
      <input id="username" name="username" minlength="3" maxlength="40" autocomplete="nickname" required>
    </div>
    <div class="form-group">
      <label for="email">電子郵件</label>
      <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="password">密碼</label>
      <input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
    </div>
    <button type="submit" style="width:100%">建立帳號</button>
  </form>
  <div class="auth-footer">已有帳號？<a href="{{ url_for('login') }}">登入</a></div>
</div>
{% endblock %}
