{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="auth-mark" aria-hidden="true">123</div>
  <h1 class="auth-title">歡迎回來</h1>
  <p class="auth-copy">登入 123NoteSystem，繼續整理你的想法。</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="email">電子郵件</label>
      <input id="email" name="email" type="text" inputmode="email" maxlength="254" autocomplete="username" aria-describedby="login-hint" required>
      <div id="login-hint" class="muted">尚未設定 Email 的舊帳號可輸入原使用者名稱。</div>
    </div>
    <div class="form-group">
      <label for="password">密碼</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" style="width:100%">登入</button>
  </form>
  <div class="auth-footer">還沒有帳號？<a href="{{ url_for('register') }}">建立帳號</a></div>
</div>
{% endblock %}
